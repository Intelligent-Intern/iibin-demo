name: iibin-shopfloor
services:
  app:
    build:
      context: ..
      dockerfile: iibin-demo/Dockerfile
    ports:
      - "127.0.0.1:5206:5206"
    environment:
      OLLAMA_URL: http://ollama:11434
      QWEN_MODEL: qwen3.5:2b
      CPU_THREADS: ${CPU_THREADS:-4}
      CUDA_VISIBLE_DEVICES: ""
    volumes:
      - shopfloor-data:/data
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5206/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
  ollama:
    image: ollama/ollama:0.30.5
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_NO_CLOUD: "1"
      CUDA_VISIBLE_DEVICES: ""
    volumes:
      - qwen-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & service_pid=$$!; until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull qwen3.5:2b; wait $$service_pid"]
    restart: unless-stopped
volumes:
  shopfloor-data:
  qwen-models:
